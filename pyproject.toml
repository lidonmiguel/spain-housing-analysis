[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spain-housing-analysis"
version = "0.1.0"
description = "Reproducible analysis of housing in Spain"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<0.14",
  "geopandas>=1.0,<2",
  "scikit-learn>=1.5,<2",
  "statsmodels>=0.14,<0.15",
  "pyarrow>=15,<24",
  "requests>=2.32,<3",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
  "shapely>=2,<3",
]

[project.optional-dependencies]
dev = [
  "jupyterlab>=4.2,<5",
  "ipykernel>=6.29,<8",
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<1",
  "ruff>=0.9,<1",
]
interactive = ["plotly>=5.24,<7", "streamlit>=1.40,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
